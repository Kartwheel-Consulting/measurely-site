# Temporary hosting on GitHub Pages, for review before the site moves to the
# company server.
#
# Every push to main: install Flutter, run the analyzer and the tests, build,
# publish. If the analyzer or a test fails, nothing is published and the
# current live version stays up.
#
# Live address: https://<owner>.github.io/<repository>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The version the tests passed on locally. Change both together.
          flutter-version: 3.35.2
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Pages serves this site from /<repository>/, not from the root, so
      # every asset path must start there.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      # Pages has no rewrite rules. For an address like /pricing it serves
      # 404.html — which, as a copy of index.html, starts the site, and the
      # site then opens the right page. Refreshing any page keeps working.
      - run: cp build/web/index.html build/web/404.html

      # Stops Pages running the files through Jekyll, which hides folders
      # whose names start with an underscore.
      - run: touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
